#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
personality = "pragmatic"

[sandbox_workspace_write]
network_access = true

[tui]
notifications = ["agent-turn-complete", "approval-requested"]
notification_method = "auto"
status_line = [
  "model-with-reasoning",
  "git-branch",
  "context-remaining",
  "context-window-size",
  "used-tokens",
  "five-hour-limit",
  "weekly-limit",
]

[agents]
enabled = true
default_subagent_model = "gpt-5.6-sol"

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = false
mac-menu-bar-enabled = false
followUpQueueMode = "queue"
composerEnterBehavior = "cmdAlways"
keepRemoteControlAwakeWhilePluggedIn = true
localeOverride = "ja-JP"
defaultTerminalLocation = "bottom"
preventSleepWhileRunning = true
show-context-window-usage = true
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "max"]
appearanceDarkCodeThemeId = "gruvbox"
appearanceTheme = "system"
appearanceLightCodeThemeId = "solarized"

[desktop.appearanceDarkChromeTheme]
accent = "#458588"
accentSource = "custom"
contrast = 60
ink = "#ebdbb2"
opaqueWindows = true
surface = "#282828"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#ebdbb2"
diffRemoved = "#cc241d"
skill = "#b16286"

[desktop.appearanceLightChromeTheme]
accent = "#b58900"
accentSource = "custom"
contrast = 45
ink = "#657b83"
opaqueWindows = false
surface = "#fdf6e3"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#859900"
diffRemoved = "#dc322f"
skill = "#d33682"
